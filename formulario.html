<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Garapena - Registro a Eventos</title>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://images.unsplash.com/photo-1515169067865-5387ec356754?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
            /* Puedes reemplazar esta URL por una imagen de fondo tuya (por ejemplo: img/garapena-eventos.jpg) */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* Fondo semitransparente para que se lea bien el formulario */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }

        .formulario-container {
            position: relative;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            z-index: 1;
        }

        h1 {
            color: #2563EB;
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #1E3A8A;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .checkbox-group {
            margin-top: 10px;
            font-size: 14px;
            color: #334155;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        .submit-btn {
            width: 100%;
            background-color: #2563EB;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 17px;
            margin-top: 15px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: #1E40AF;
            transform: scale(1.02);
        }

        a {
            color: #2563EB;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            color: white;
            position: absolute;
            bottom: 15px;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="formulario-container">
        <h1>Registro a Evento Garapena</h1>
        
        <form action="/procesar-datos" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="telefono">Número Telefónico</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 555-123-4567" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" required>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="Motivo del registro o consulta" required>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="politicas" name="politicas" required>
                    Acepto las <a href="#" target="_blank">políticas de privacidad</a>.
                </label>
            </div>

            <button type="submit" class="submit-btn">Enviar Información</button>
            
        </form>
    </div>

    <footer>© 2025 Garapena · Innovación digital y eventos tecnológicos</footer>

</body>
</html>
